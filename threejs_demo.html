<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Idea Visualizer — three.js demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; font-family: system-ui, sans-serif; }
  #ui {
    position: fixed; left: 16px; bottom: 16px; z-index: 10;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    color: #cfe; font-size: 13px;
  }
  #ui input {
    background: rgba(255,255,255,.08); border: 1px solid rgba(120,200,255,.4);
    color: #eaf6ff; padding: 8px 12px; border-radius: 8px; width: 220px; outline: none;
  }
  #ui button {
    background: rgba(80,160,255,.18); border: 1px solid rgba(120,200,255,.5);
    color: #eaf6ff; padding: 8px 14px; border-radius: 8px; cursor: pointer;
  }
  #ui button:hover { background: rgba(80,160,255,.35); }
  #ui button.on { background: rgba(120,255,180,.3); border-color: rgba(120,255,180,.7); }
  #hint { position: fixed; top: 14px; left: 16px; z-index: 10; color: #7fa; font-size: 12px; opacity:.7; }
  #mic { font-size: 12px; opacity:.85; }
</style>
</head>
<body>
<div id="hint">マウスドラッグで回転 / ホイールでズーム。下の入力でキーワードを飛ばす。🎤で音声認識(対応ブラウザ)。</div>
<div id="ui">
  <input id="kw" type="text" placeholder="キーワードを入力して Enter" />
  <button id="add">飛ばす</button>
  <button id="micBtn">🎤 音声で反応</button>
  <button id="speechBtn">🗣️ 音声認識</button>
  <span id="mic"></span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060a, 0.018);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 6, 34);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

// ---------- particle wave field (webgl_points_waves vibe) ----------
const COLS = 90, ROWS = 90, SEP = 0.7;
const count = COLS * ROWS;
const positions = new Float32Array(count * 3);
const colors = new Float32Array(count * 3);
const base = new Float32Array(count * 2);
let i = 0;
const colA = new THREE.Color(0x3aa0ff), colB = new THREE.Color(0xff4fd8);
for (let x = 0; x < COLS; x++) {
  for (let z = 0; z < ROWS; z++) {
    const px = (x - COLS / 2) * SEP, pz = (z - ROWS / 2) * SEP;
    positions[i * 3] = px; positions[i * 3 + 1] = 0; positions[i * 3 + 2] = pz;
    base[i * 2] = px; base[i * 2 + 1] = pz;
    const c = colA.clone().lerp(colB, x / COLS);
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
    i++;
  }
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const points = new THREE.Points(geo, new THREE.PointsMaterial({
  size: 0.35, vertexColors: true, transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(points);

// a glowing core so bloom has something punchy
const core = new THREE.Mesh(
  new THREE.IcosahedronGeometry(2.2, 2),
  new THREE.MeshBasicMaterial({ color: 0x66ccff, wireframe: true })
);
core.position.y = 5;
scene.add(core);

// ---------- keyword text sprites (speech -> keyword -> visual) ----------
const sprites = [];
function makeLabel(text) {
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  ctx.font = 'bold 96px system-ui, sans-serif';
  const w = Math.ceil(ctx.measureText(text).width) + 60;
  cv.width = w; cv.height = 150;
  ctx.font = 'bold 96px system-ui, sans-serif';
  ctx.fillStyle = '#eaffff'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#3af'; ctx.shadowBlur = 30;
  ctx.fillText(text, 30, 80);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  sp.scale.set(w / 150 * 4, 4, 1);
  sp.position.set((Math.random() - 0.5) * 20, 2 + Math.random() * 10, (Math.random() - 0.5) * 10);
  sp.userData = { vy: 0.02 + Math.random() * 0.03, life: 1 };
  scene.add(sp); sprites.push(sp);
  if (sprites.length > 12) { const old = sprites.shift(); scene.remove(old); }
}
makeLabel('idea'); makeLabel('visualize');

// ---------- postprocessing (bloom + afterimage trails) ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const after = new AfterimagePass(0.88);          // motion trails
composer.addPass(after);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.4, 0.6, 0.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- audio reactivity (mic) ----------
let analyser = null, audioData = null, level = 0;
async function startMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser(); analyser.fftSize = 256;
    audioData = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser);
    micBtn.classList.add('on'); mic.textContent = 'マイク反応 ON';
  } catch (e) { mic.textContent = 'マイク不可: ' + e.message; }
}

// ---------- speech recognition (keyword extraction stand-in) ----------
let recog = null, recogOn = false;
function startSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { mic.textContent = 'このブラウザは音声認識非対応(Chrome推奨)'; return; }
  recog = new SR();
  recog.lang = 'ja-JP'; recog.continuous = true; recog.interimResults = false;
  recog.onresult = (ev) => {
    const t = ev.results[ev.results.length - 1][0].transcript.trim();
    // crude keyword split — replace with real NLP later
    t.split(/[\s、。,.!?！？]+/).filter(w => w.length > 1).slice(0, 4).forEach(makeLabel);
  };
  recog.onend = () => { if (recogOn) recog.start(); };
  recog.start(); recogOn = true; speechBtn.classList.add('on'); mic.textContent = '音声認識 ON — 話してみて';
}

// ---------- UI ----------
const kw = document.getElementById('kw');
document.getElementById('add').onclick = () => { if (kw.value.trim()) { makeLabel(kw.value.trim()); kw.value = ''; } };
kw.addEventListener('keydown', e => { if (e.key === 'Enter' && kw.value.trim()) { makeLabel(kw.value.trim()); kw.value = ''; } });
const micBtn = document.getElementById('micBtn'); micBtn.onclick = startMic;
const speechBtn = document.getElementById('speechBtn');
speechBtn.onclick = () => { if (!recogOn) startSpeech(); else { recogOn = false; recog && recog.stop(); speechBtn.classList.remove('on'); mic.textContent = '音声認識 OFF'; } };

// ---------- loop ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if (analyser) { analyser.getByteFrequencyData(audioData);
    let s = 0; for (const v of audioData) s += v; level = s / audioData.length / 255; }
  const amp = 1 + level * 6;                 // audio drives wave height + bloom
  bloom.strength = 1.4 + level * 2.5;
  after.uniforms.damp.value = 0.86 + level * 0.1;

  const pos = geo.attributes.position.array;
  for (let k = 0; k < count; k++) {
    const bx = base[k * 2], bz = base[k * 2 + 1];
    pos[k * 3 + 1] = Math.sin(bx * 0.3 + t) * Math.cos(bz * 0.3 + t) * (1.2 * amp);
  }
  geo.attributes.position.needsUpdate = true;

  core.rotation.x = t * 0.3; core.rotation.y = t * 0.4;
  core.scale.setScalar(1 + level * 1.5);

  for (let s = sprites.length - 1; s >= 0; s--) {
    const sp = sprites[s];
    sp.position.y += sp.userData.vy; sp.userData.life -= 0.0015;
    sp.material.opacity = Math.max(0, sp.userData.life);
    if (sp.userData.life <= 0) { scene.remove(sp); sprites.splice(s, 1); }
  }

  controls.update();
  composer.render();
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
